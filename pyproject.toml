[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "object-tracking"
version = "0.1.0"
description = "Real-time multi-object tracking: detection + IoU/Hungarian association with persistent IDs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Eloy Melo", email = "eloymelo@example.com"},
]
keywords = ["computer-vision", "object-tracking", "opencv", "yolo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy",
    "opencv-python>=4.10,<5",
    "scipy",
    "ultralytics",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/eloymelo/object-tracking"
Repository = "https://github.com/eloymelo/object-tracking"

[tool.setuptools.packages.find]
where = ["src"]